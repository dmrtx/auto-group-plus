<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoGroup+ Settings</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header class="page-header">
      <div>
        <p class="eyebrow">Chrome tab groups</p>
        <h1>AutoGroup+</h1>
      </div>
      <div class="header-actions">
        <button id="view-overview-btn" class="btn btn-secondary">
          Overview
        </button>
        <button id="add-rule-btn" class="btn btn-primary">
          <span>+</span> Add Group Rule
        </button>
      </div>
    </header>

    <section id="global-settings" class="settings-panel">
      <div class="section-heading">
        <p class="eyebrow">Runtime behavior</p>
        <h2>Global Settings</h2>
      </div>

      <div class="settings-list">
        <label class="checkbox-group setting-row">
          <input type="checkbox" id="setting-exclude-webapps" checked>
          <span><strong>Exclude Web Apps:</strong> Do not auto-group tabs in popup windows or installed web apps.</span>
        </label>

        <label class="checkbox-group setting-row">
          <input type="checkbox" id="setting-merge-countdown" checked>
          <span><strong>Merge Warning:</strong> Show a countdown timer before moving a tab to another window.</span>
        </label>
      </div>

      <div class="settings-actions">
        <button id="rebuild-groups-btn" class="btn btn-primary">
          Rebuild tab groups now
        </button>
      </div>
    </section>

    <div id="rules-container">
      <!-- Rules will be injected here -->
    </div>
  </div>

  <!-- Rule Modal -->
  <div id="rule-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom: 1.5rem;">Add Group Rule</h2>
      <form id="rule-form">
        <input type="hidden" id="rule-id">

        <div class="form-group">
          <label for="rule-name">Group Title</label>
          <input type="text" id="rule-name" placeholder="e.g. Work, Social, News" required>
        </div>

        <div class="form-group">
          <label>Group Color</label>
          <div class="color-options" id="color-options">
            <div class="color-option bg-grey" data-color="grey"></div>
            <div class="color-option bg-blue" data-color="blue" id="default-color"></div>
            <div class="color-option bg-red" data-color="red"></div>
            <div class="color-option bg-yellow" data-color="yellow"></div>
            <div class="color-option bg-green" data-color="green"></div>
            <div class="color-option bg-pink" data-color="pink"></div>
            <div class="color-option bg-purple" data-color="purple"></div>
            <div class="color-option bg-cyan" data-color="cyan"></div>
            <div class="color-option bg-orange" data-color="orange"></div>
          </div>
          <input type="hidden" id="selected-color" value="blue">
        </div>

        <div class="form-group">
          <label for="rule-patterns">URL Patterns (comma separated)</label>
          <input type="text" id="rule-patterns" placeholder="e.g. *.google.com, github.com" required>
          <p style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.5rem;">
            Supports: example.com, *.example.com, and full URLs.
          </p>
        </div>

        <div class="form-group">
          <label for="rule-fixed-tabs">Fixed tab positions</label>
          <textarea id="rule-fixed-tabs" rows="4" placeholder="http://192.0.2.1:9000/*&#10;1, https://example.com/dashboard"></textarea>
          <p style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.5rem;">
            One per line: URL pattern or index, URL pattern. Supports * wildcards. Index 0 is the leftmost tab in the window.
          </p>
        </div>

        <div class="form-group" style="display: flex; flex-direction: column; gap: 0.75rem;">
          <label class="checkbox-group">
            <input type="checkbox" id="rule-merge" checked>
            <span>Merge across windows</span>
          </label>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Rule</button>
        </div>
      </form>
    </div>
  </div>

  <script src="constants.js"></script>
  <script src="rules.js"></script>
  <script src="options.js"></script>
</body>

</html>
