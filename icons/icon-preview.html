<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AutoGroup+ Icon Preview</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        min-height: 100vh;
      }
      .row {
        display: flex;
        gap: 24px;
        align-items: center;
      }
      .size-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .size-box div {
        border-radius: 8px;
        background: #111827;
        padding: 8px;
      }
      .label {
        font-size: 12px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="size-box">
        <div>
          <img src="./icon-source.svg" width="16" height="16" alt="16x16">
        </div>
        <div class="label">16x16</div>
      </div>
      <div class="size-box">
        <div>
          <img src="./icon-source.svg" width="48" height="48" alt="48x48">
        </div>
        <div class="label">48x48</div>
      </div>
      <div class="size-box">
        <div>
          <img src="./icon-source.svg" width="128" height="128" alt="128x128">
        </div>
        <div class="label">128x128</div>
      </div>
    </div>
    <p class="label">
      Abre este archivo en el navegador, haz clic derecho en cada icono &rarr; "Guardar imagen como..." para generar los PNG que quieras.
    </p>
  </body>
</html>
