<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Transparent background -->
  <rect x="0" y="0" width="128" height="128" fill="none"/>

  <!-- Blue rounded square -->
  <rect
    x="12"
    y="12"
    width="104"
    height="104"
    rx="24"
    ry="24"
    fill="#1D8CF8"
  />

  <!-- White plus vertical -->
  <rect
    x="56"
    y="32"
    width="16"
    height="64"
    fill="#FFFFFF"
    rx="4"
    ry="4"
  />

  <!-- White plus horizontal -->
  <rect
    x="32"
    y="56"
    width="64"
    height="16"
    fill="#FFFFFF"
    rx="4"
    ry="4"
  />
</svg>
